<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MajesticUI</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; background: #111827; color: #f9fafb; }
      main { max-width: 760px; margin: 0 auto; padding: 12vh 24px; }
      .eyebrow { color: #a78bfa; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: .95; margin: 16px 0; }
      p { color: #cbd5e1; font-size: 1.1rem; line-height: 1.6; }
      .card { margin-top: 40px; padding: 24px; border: 1px solid #374151; border-radius: 16px; background: #1f2937; }
      code { color: #ddd6fe; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">MajesticUI preview</div>
      <h1>Source-owned UI, ready to compose.</h1>
      <p>The workspace is running. This preview is the docs boundary for the registry, variants, selective dependencies, and safe installation system.</p>
      <div class="card"><strong>Next step</strong><p>Build the first end-to-end flow with <code>majestic init</code> and <code>majestic add button</code>.</p></div>
    </main>
  </body>
</html>
